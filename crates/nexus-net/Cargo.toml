[package]
name = "nexus-net"
description = "NexusTalk client networking: WebSocket + HTTP with TLS certificate pinning (TOFU)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "__rustls-tls"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
webpki-roots = "1"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync"] }
futures-util = "0.3"
thiserror = "2"
url = "2"
