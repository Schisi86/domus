[package]
name = "nexustalk"
description = "Domus – selbst hostbare Kommunikationssoftware (früher NexUs/NexusTalk)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "nexustalk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "nexustalk"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nexus-net = { path = "../../crates/nexus-net" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros", "fs"] }
futures-util = "0.3.34"
tracing = "0.1.44"
base64 = "0.22"
tauri-plugin-opener = "2"
# Hosting servers (desktop and Android).
nexus-server = { path = "../../crates/nexus-server" }
igd-next = { version = "0.18", features = ["aio_tokio"] }
bore-cli = { version = "0.6", default-features = false }

# Desktop only: tray, autostart, single instance, global keys.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"

# macOS and iOS: session tokens encrypted with a key from the keychain.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
security-framework = "3"
ring = "0.17"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory", "Win32_UI_Shell", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi"] }


[dev-dependencies]
turn = "0.17.2"
webrtc-util = "0.17"
rusqlite = { version = "0.40", features = ["bundled"] }
