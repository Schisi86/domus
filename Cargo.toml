[workspace]
resolver = "2"
members = ["crates/nexus-server", "crates/nexus-net", "app/src-tauri"]

[workspace.package]
version = "0.9.1"
edition = "2021"
license = "MIT"
homepage = "https://nexustalk-app.netlify.app"
authors = ["Christian Schiessl <https://cjs86.netlify.app>"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

