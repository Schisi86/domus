<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- NexUs: one continuous stroke forms the N – two points connected, the
       meeting point glows. A vivid emerald → cyan → indigo squircle. -->
  <defs>
    <linearGradient id="bg" x1="0.08" y1="0.02" x2="0.95" y2="1">
      <stop offset="0" stop-color="#34f5b0"/>
      <stop offset="0.45" stop-color="#10b5c8"/>
      <stop offset="1" stop-color="#5b4cf0"/>
    </linearGradient>
    <radialGradient id="shine" cx="30%" cy="12%" r="75%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="depth" cx="70%" cy="100%" r="80%">
      <stop offset="0" stop-color="#1e1065" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#1e1065" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3f6ff"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#14095c" flood-opacity="0.38"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="sq"><rect x="40" y="40" width="944" height="944" rx="236"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect x="40" y="40" width="944" height="944" fill="url(#bg)"/>
    <rect x="40" y="40" width="944" height="944" fill="url(#depth)"/>
    <rect x="40" y="40" width="944" height="944" fill="url(#shine)"/>
  </g>
  <rect x="44" y="44" width="936" height="936" rx="232" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="6"/>
  <g filter="url(#shadow)">
    <path d="M318 712 V312 L706 712 V312" fill="none" stroke="url(#ink)" stroke-width="128" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <circle cx="706" cy="312" r="58" fill="#c9fff0" filter="url(#glow)" opacity="0.9"/>
  <circle cx="706" cy="312" r="40" fill="#ffffff"/>
</svg>
